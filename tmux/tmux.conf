# Terminal: advertise a tmux terminfo inside, and true color from Ghostty outside
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -sg escape-time 10        # don't wait after Esc (vim, zsh vi-mode)
set -g focus-events on        # pass focus in/out to vim, zsh, etc.
set -g history-limit 50000
set -g set-clipboard on       # let apps inside tmux write to the system clipboard
set -g mouse on

# Number windows and panes from 1 and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
